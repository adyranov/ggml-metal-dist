name: Set up build environment
description: Checkout, cache Homebrew downloads and ccache, install dependencies, export env vars
inputs:
  brew_deps:
    description: Space-separated Homebrew packages to install
    required: true
  runs_on:
    description: Runner label (used for cache key)
    required: true
  tool:
    description: Tool name (used for ccache key)
    required: true
  enable_ccache:
    description: Whether to cache and configure ccache
    required: false
    default: "true"
  cache_prefix:
    description: Prefix for ccache key (e.g., "release-" to separate release from CI)
    required: false
    default: ""
outputs:
  ccache_hit:
    description: Whether ccache restore found an exact key
    value: ${{ steps.ccache-restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Cache Homebrew downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: brew-${{ inputs.runs_on }}-${{ hashFiles('manifest.json') }}
        restore-keys: |
          brew-${{ inputs.runs_on }}-
    - name: Cache ccache
      id: ccache-restore
      if: inputs.enable_ccache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ inputs.cache_prefix }}${{ inputs.tool }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.cache_prefix }}${{ inputs.tool }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Homebrew packages
      shell: bash
      env:
        BREW_DEPS: ${{ inputs.brew_deps }}
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
        HOMEBREW_REQUIRE_TAP_TRUST: "1"
      run: |
        brew untap aws/tap 2>/dev/null || true
        brew untap azure/bicep 2>/dev/null || true
        brew trust --formula azure/bicep/bicep 2>/dev/null || true
        # Only install packages not already present to avoid "already installed" noise
        pkgs_to_install=""
        for pkg in ccache $BREW_DEPS; do
          brew list --formula "$pkg" &>/dev/null || pkgs_to_install="$pkgs_to_install $pkg"
        done
        # shellcheck disable=SC2086
        [ -z "$pkgs_to_install" ] || brew install $pkgs_to_install
    - name: Export build environment variables
      shell: bash
      run: |
        {
          echo "HOMEBREW_NO_AUTO_UPDATE=1"
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1"
          echo "HOMEBREW_NO_ENV_HINTS=1"
          echo "HOMEBREW_REQUIRE_TAP_TRUST=1"
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache"
          echo "CCACHE_BASEDIR=${{ github.workspace }}"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
