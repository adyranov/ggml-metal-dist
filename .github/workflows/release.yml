name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. v26.6.1). Leave empty to auto-detect next CalVer."
        required: false
        type: string
      affected_base_ref:
        description: "Optional base ref for affected release matrix. Blank = release all tools."
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ci_matrix: ${{ steps.plan.outputs.ci_matrix }}
      release_matrix: ${{ steps.plan.outputs.release_matrix }}
      ci_brew_deps: ${{ steps.plan.outputs.ci_brew_deps }}
      release_brew_deps: ${{ steps.plan.outputs.release_brew_deps }}
      affected_base_ref: ${{ steps.plan.outputs.affected_base_ref }}
      has_ci_work: ${{ steps.plan.outputs.has_ci_work }}
      has_release_work: ${{ steps.plan.outputs.has_release_work }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          AFFECTED_BASE_REF: ${{ inputs.affected_base_ref }}
        run: |
          set -euo pipefail
          args=(plan-release)
          [ -z "$INPUT_VERSION" ] || args+=(--version "$INPUT_VERSION")
          [ -z "$AFFECTED_BASE_REF" ] || args+=(--base-ref "$AFFECTED_BASE_REF")
          ./scripts/dist.sh "${args[@]}"
      - name: Summarize release version
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "### Release version: \`${RELEASE_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
  ggml_head:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ggml_head: ${{ steps.ggml.outputs.ggml_head }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      - id: ggml
        env:
          BASE_REF: ${{ needs.plan.outputs.affected_base_ref }}
        run: |
          set -euo pipefail
          args=(reconcile-ggml)
          [ -z "$BASE_REF" ] || args+=(--base-ref "$BASE_REF")
          ./scripts/dist.sh "${args[@]}"
  ci:
    needs: [plan, ggml_head]
    uses: ./.github/workflows/_validate.yml
    with:
      type: build
      tier: smoke
      matrix: ${{ needs.plan.outputs.ci_matrix }}
      brew_deps: ${{ needs.plan.outputs.ci_brew_deps }}
      has_work: ${{ needs.plan.outputs.has_ci_work }}
      ggml_head: ${{ needs.ggml_head.outputs.ggml_head }}
  build-release:
    needs: [plan, ggml_head, ci]
    if: needs.plan.outputs.has_release_work == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.release_matrix) }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    env:
      BREW_DEPS: ${{ needs.plan.outputs.release_brew_deps }}
      TOOL: ${{ matrix.tool }}
      ARCH: ${{ matrix.arch }}
      EXPECTED_GGML_HEAD: ${{ needs.ggml_head.outputs.ggml_head }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: setup_build_env
        uses: ./.github/actions/setup-build-env
        with:
          brew_deps: ${{ needs.plan.outputs.release_brew_deps }}
          runs_on: ${{ matrix.runs-on }}
          tool: ${{ matrix.tool }}
          enable_ccache: "true"
          cache_prefix: ""
      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      - name: Build and package
        run: |
          set -euo pipefail
          ./scripts/dist.sh build "$TOOL" --arch "$ARCH" --version "$VERSION" \
            --expected-ggml-head "$EXPECTED_GGML_HEAD"
          ccache --show-stats || true
      - name: Verify package artifact
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -euo pipefail
          echo "workspace: $GITHUB_WORKSPACE"
          echo "artifact dir: $ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -print
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.sha256' -print -quit)"
      - name: Save ccache
        if: always() && steps.setup_build_env.outputs.ccache_hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: error
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: artifacts/
          github-token: ${{ secrets.GITHUB_TOKEN }}
  release:
    needs: [plan, ci, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/dist.sh publish-release --version "$VERSION" --artifacts-dir artifacts --flatten
