name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. v26.6.1). Leave empty to auto-detect next CalVer."
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ci_matrix: ${{ steps.plan.outputs.ci_matrix }}
      release_matrix: ${{ steps.plan.outputs.release_matrix }}
      prefetch_matrix: ${{ steps.plan.outputs.prefetch_matrix }}
      ci_brew_deps: ${{ steps.plan.outputs.ci_brew_deps }}
      release_brew_deps: ${{ steps.plan.outputs.release_brew_deps }}
      affected_base_ref: ${{ steps.plan.outputs.affected_base_ref }}
      has_ci_work: ${{ steps.plan.outputs.has_ci_work }}
      has_release_work: ${{ steps.plan.outputs.has_release_work }}
      prefetch_has_work: ${{ steps.plan.outputs.prefetch_has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(plan-release)
          [ -z "$INPUT_VERSION" ] || args+=(--version "$INPUT_VERSION")
          ./scripts/dist.sh "${args[@]}"
      - name: Summarize release version
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "### Release version: \`${RELEASE_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
  prefetch:
    needs: plan
    if: needs.plan.outputs.prefetch_has_work == 'true'
    uses: ./.github/workflows/_prefetch.yml
    secrets: inherit
    with:
      tier: smoke
      matrix: ${{ needs.plan.outputs.prefetch_matrix }}
  ggml_head:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ggml_head: ${{ steps.ggml.outputs.ggml_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - id: ggml
        env:
          BASE_REF: ${{ needs.plan.outputs.affected_base_ref }}
        run: |
          set -euo pipefail
          args=(reconcile-ggml)
          [ -z "$BASE_REF" ] || args+=(--base-ref "$BASE_REF")
          ./scripts/dist.sh "${args[@]}"
  build-release:
    needs: [plan, ggml_head, prefetch]
    if: |
      !failure() && !cancelled() &&
      needs.plan.outputs.has_release_work == 'true' &&
      needs.plan.result == 'success' &&
      needs.ggml_head.result == 'success' &&
      (needs.prefetch.result == 'success' || needs.prefetch.result == 'skipped')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.release_matrix) }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    env:
      BREW_DEPS: ${{ needs.plan.outputs.release_brew_deps }}
      TOOL: ${{ matrix.tool }}
      ARCH: ${{ matrix.arch }}
      EXPECTED_GGML_HEAD: ${{ needs.ggml_head.outputs.ggml_head }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup_build_env
        uses: ./.github/actions/setup-build-env
        with:
          brew_deps: ${{ needs.plan.outputs.release_brew_deps }}
          runs_on: ${{ matrix.runs-on }}
          tool: ${{ matrix.tool }}
          enable_ccache: "true"
          cache_prefix: ""
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build and package
        run: |
          set -euo pipefail
          ./scripts/dist.sh build "$TOOL" --arch "$ARCH" --version "$VERSION" \
            --expected-ggml-head "$EXPECTED_GGML_HEAD"
          ccache --show-stats || true
      - name: Restore Hugging Face models cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache/hub
          key: hf-models-smoke-${{ matrix.tool }}-${{ hashFiles('manifest.json') }}
          restore-keys: |
            hf-models-smoke-${{ matrix.tool }}-
          enableCrossOsArchive: true
      - name: Verify Hugging Face models cache
        env:
          TOOL: ${{ matrix.tool }}
          CI_MATRIX: ${{ needs.plan.outputs.ci_matrix }}
        run: |
          IS_TESTABLE=$(python3 -c "
          import json, os
          m = json.loads(os.environ['CI_MATRIX'])
          tool, arch = os.environ['TOOL'], os.environ['ARCH']
          print('true' if any(r.get('tool')==tool and r.get('arch')==arch and r.get('type')!='unit' for r in m.get('include', [])) else 'false')
          ")
          if [ "$IS_TESTABLE" = "true" ]; then
            HF_HOME=${GITHUB_WORKSPACE}/.hf-cache HF_HUB_CACHE=${GITHUB_WORKSPACE}/.hf-cache/hub HUGGINGFACE_HUB_CACHE=${GITHUB_WORKSPACE}/.hf-cache/hub \
            ./scripts/dist.sh verify-hf-cache "$TOOL" --tier smoke
          fi
      - name: Validate built package
        env:
          CI_MATRIX: ${{ needs.plan.outputs.ci_matrix }}
        run: |
          VALIDATE_TYPE=$(python3 -c "
          import json, os
          m = json.loads(os.environ['CI_MATRIX'])
          tool, arch = os.environ['TOOL'], os.environ['ARCH']
          print(next((r.get('type') for r in m.get('include', []) if r.get('tool')==tool and r.get('arch')==arch), 'none'))
          ")
          if [ "$VALIDATE_TYPE" != "none" ]; then
            TAR_FILE="artifacts/${TOOL}-${VERSION}-${ARCH}-apple-darwin.tar.gz"
            tar -xzf "$TAR_FILE" -C artifacts/
            BIN_DIR="$(pwd)/artifacts/${TOOL}-${VERSION}/bin"
            HF_HOME=${GITHUB_WORKSPACE}/.hf-cache HF_HUB_CACHE=${GITHUB_WORKSPACE}/.hf-cache/hub HUGGINGFACE_HUB_CACHE=${GITHUB_WORKSPACE}/.hf-cache/hub \
            ./scripts/dist.sh validate "$TOOL" --type "$VALIDATE_TYPE" --tier smoke --bin-dir "$BIN_DIR"
          else
            echo "Skipping validation for ${TOOL} on ${ARCH} (excluded from CI)"
          fi
      - name: Verify package artifact
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -euo pipefail
          echo "workspace: $GITHUB_WORKSPACE"
          echo "artifact dir: $ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -print
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.sha256' -print -quit)"
      - name: Save ccache
        if: always() && steps.setup_build_env.outputs.ccache_hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: error
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/
          github-token: ${{ secrets.GITHUB_TOKEN }}
  release:
    needs: [plan, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/dist.sh publish-release --version "$VERSION" --artifacts-dir artifacts --flatten
