name: Prefetch
on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string
        description: "Model tier (smoke or full)"
      matrix:
        required: true
        type: string
        description: "Prefetch matrix JSON (tool rows)"
    secrets:
      HF_TOKEN:
        required: false
        description: "Hugging Face API token for authenticated downloads"
permissions:
  contents: read
jobs:
  prefetch:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ubuntu-24.04
    env:
      HF_CACHE_KEY_PREFIX: hf-models-${{ inputs.tier }}-${{ matrix.tool }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Hugging Face CLI
        run: pip install 'huggingface_hub[cli]'
      - name: Restore Hugging Face models cache
        id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache/hub
          key: ${{ env.HF_CACHE_KEY_PREFIX }}-${{ hashFiles('manifest.json') }}
          restore-keys: |
            ${{ env.HF_CACHE_KEY_PREFIX }}-
          enableCrossOsArchive: true
      - name: Prefetch models
        env:
          TIER: ${{ inputs.tier }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          ./scripts/dist.sh prefetch "$TOOL" --tier "$TIER"
      - name: Save Hugging Face models cache
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache/hub
          key: ${{ env.HF_CACHE_KEY_PREFIX }}-${{ hashFiles('manifest.json') }}
          enableCrossOsArchive: true
