name: Prefetch
on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string
        description: "Model tier (smoke or full)"
      matrix:
        required: true
        type: string
        description: "Prefetch matrix JSON (tool rows)"
    secrets:
      HF_TOKEN:
        required: false
        description: "Hugging Face API token for authenticated downloads"
permissions:
  contents: read
jobs:
  prefetch:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ubuntu-24.04
    env:
      HF_CACHE_KEY_PREFIX: hf-models-${{ inputs.tier }}-${{ matrix.tool }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/.hf-cache/hub
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      - name: Install Hugging Face CLI
        run: pip install 'huggingface_hub[cli]'
      - name: Restore Hugging Face models cache
        id: hf-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .hf-cache/hub
          key: ${{ env.HF_CACHE_KEY_PREFIX }}-${{ hashFiles('manifest.json') }}
          restore-keys: |
            ${{ env.HF_CACHE_KEY_PREFIX }}-
          enableCrossOsArchive: true
      - name: Prefetch models
        env:
          TIER: ${{ inputs.tier }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          ./scripts/dist.sh prefetch "$TOOL" --tier "$TIER"
      - name: Save Hugging Face models cache
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .hf-cache/hub
          key: ${{ env.HF_CACHE_KEY_PREFIX }}-${{ hashFiles('manifest.json') }}
          enableCrossOsArchive: true
